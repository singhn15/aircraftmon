name: CI / Security Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: secrets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pipenv
        run: pip install pipenv
      - name: Install deps from Pipfile.lock
        run: pipenv install --dev --deploy
      - name: Run tests with coverage
        env:
          AWS_DEFAULT_REGION: us-east-2
        run: pipenv run pytest --cov=. --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
 
  image-scan:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aircraftmon-backend:scan ./backend
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: aircraftmon-backend:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  dast:
    needs: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t aircraftmon-backend:scan ./backend
      - name: Start the app container
        run: |
          docker run -d --name app -p 4200:4200 \
            -e AWS_DEFAULT_REGION=us-east-2 aircraftmon-backend:scan
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200/ && break
            sleep 2
          done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://172.17.0.1:4200'
          allow_issue_writing: false
          fail_action: false
